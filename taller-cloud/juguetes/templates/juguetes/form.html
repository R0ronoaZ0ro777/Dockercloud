<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if juguete %}Editar{% else %}Crear{% endif %} Juguete</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0d0d0d 0%, #1a1a1a 100%);
            color: #00bfff;
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: linear-gradient(135deg, #0d0d0d 0%, #1a1a1a 100%);
            padding: 40px;
            border-radius: 12px;
            border: 2px solid #00bfff;
            box-shadow: 0 0 30px rgba(0, 191, 255, 0.2);
        }
        
        h1 {
            text-align: center;
            color: #00bfff;
            margin-bottom: 30px;
            font-size: 28px;
            text-shadow: 0 0 10px rgba(0, 191, 255, 0.5);
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #00bfff;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        input, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #00bfff;
            border-radius: 6px;
            background: #0d0d0d;
            color: #00bfff;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #00ff00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.4), inset 0 0 10px rgba(0, 191, 255, 0.1);
            background: #0d0d0d;
        }
        
        input::placeholder, textarea::placeholder {
            color: #00bfff;
            opacity: 0.6;
        }
        
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        
        textarea {
            resize: vertical;
            min-height: 120px;
        }
        
        .error {
            background: linear-gradient(135deg, #4b3131 0%, #3a2626 100%);
            border-left: 4px solid #ff6b6b;
            color: #ff6b6b;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.2);
        }
        
        .error::before {
            content: "⚠️ ";
            margin-right: 8px;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00bfff 0%, #0099cc 100%);
            color: #0d0d0d;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(0, 191, 255, 0.3);
        }
        
        button:hover {
            background: linear-gradient(135deg, #00ff00 0%, #00cc00 100%);
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.5);
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        a {
            display: inline-block;
            text-align: center;
            margin-top: 20px;
            color: #00bfff;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            padding: 10px 20px;
            border: 2px solid #00bfff;
            border-radius: 6px;
            width: 100%;
        }
        
        a:hover {
            background: #00bfff;
            color: #0d0d0d;
            box-shadow: 0 0 20px rgba(0, 191, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>{% if juguete %}Editar Juguete{% else %}Crear Nuevo Juguete{% endif %}</h1>
        
        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="nombre">Nombre del Juguete:</label>
                <input 
                    type="text" 
                    id="nombre" 
                    name="nombre" 
                    value="{% if juguete %}{{ juguete.nombre }}{% endif %}"
                    required
                    placeholder="Ej: Lego Star Wars"
                >
            </div>
            
            <div class="form-group">
                <label for="precio">Precio ($):</label>
                <input 
                    type="number" 
                    id="precio" 
                    name="precio" 
                    step="0.01"
                    min="0"
                    value="{% if juguete %}{{ juguete.precio }}{% endif %}"
                    required
                    placeholder="Ej: 59.99"
                >
            </div>
            
            <div class="form-group">
                <label for="stock">Stock (Unidades):</label>
                <input 
                    type="number" 
                    id="stock" 
                    name="stock" 
                    min="0"
                    value="{% if juguete %}{{ juguete.stock }}{% endif %}"
                    required
                    placeholder="Ej: 10"
                >
            </div>
            
            <div class="form-group">
                <label for="descripcion">Descripción:</label>
                <textarea 
                    id="descripcion" 
                    name="descripcion" 
                    rows="5"
                    placeholder="Describe el juguete..."
                >{% if juguete %}{{ juguete.descripcion }}{% endif %}</textarea>
            </div>
            
            <button type="submit">
                {% if juguete %}💾 Guardar Cambios{% else %}Crear Juguete{% endif %}
            </button>
        </form>
        
        <a href="/juguetes/">← Volver</a>
    </div>
</body>
</html>
